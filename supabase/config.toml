# Minimal local Supabase CLI config. Requires the Supabase CLI
# (https://supabase.com/docs/guides/cli) and Docker Desktop for
# `supabase start` / `supabase db reset`. No hosted project is linked yet -
# see docs/DEPLOYMENT.md for when/how to create one.

project_id = "mrmaling-website"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_confirmations = false
